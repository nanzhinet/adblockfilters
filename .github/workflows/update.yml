name: Update Filters
on: 
  workflow_dispatch:
  schedule:
  - cron: 0 */8 * * *

env:
  TZ: Asia/Shanghai
  SINGBOX_VERSION: 1.12.12
  MIHOMO_VERSION: 1.19.16

jobs:
  Update_Filters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gzip
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          pip install -U tld IPy dnspython httpx loguru

      - name: Update Filters
        id: update
        run: |
          python adblock.py
          rm -rf __pycache__
          rm -rf app/__pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Compile Sing-Box filters
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v${{env.SINGBOX_VERSION}}/sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          tar -zxvf sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          chmod +x sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output rules/adblocksingbox.srs     rules/adblocksingbox.json
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output rules/adblocksingboxlite.srs rules/adblocksingboxlite.json
          rm -rf sing-box*

      - name: Compile mihomo filters
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v${{env.MIHOMO_VERSION}}/mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          gzip -d mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          chmod +x mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml rules/adblockmihomo.yaml     rules/adblockmihomo.mrs
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml rules/adblockmihomolite.yaml rules/adblockmihomolite.mrs
          rm -rf mihomo*

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.update.outputs.message }}

  Release_Filters:
    needs: [ Update_Filters ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep "^# Version:" rules/adblockdns.txt | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            rules/adblockfilters.txt
            rules/adblockfilterslite.txt
            rules/adblockdns.txt
            rules/adblockdnslite.txt
            rules/adblockdnsmasq.txt
            rules/adblockdnsmasqlite.txt
            rules/adblocksmartdns.conf
            rules/adblocksmartdnslite.conf
            rules/adblockshadowrocket.sgmodule
            rules/adblockshadowrocketlite.sgmodule
            rules/adblockqx.conf
            rules/adblockqxlite.conf
            rules/adblockclash.list
            rules/adblockclashlite.list
            rules/adblockmihomo.yaml
            rules/adblockmihomolite.yaml
            rules/adblockmihomo.mrs
            rules/adblockmihomolite.mrs
            rules/adblockhosts.txt
            rules/adblockhostslite.txt
            rules/adblocksingbox.json
            rules/adblocksingboxlite.json
            rules/adblocksingbox.srs
            rules/adblocksingboxlite.srs
            rules/adblockloon.list
            rules/adblockloonlite.list
            rules/adblocksurge.list
            rules/adblocksurgelite.list
            rules/adblockmosdns.txt
            rules/adblockmosdnslite.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成构建证明
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            rules/adblockfilters.txt
            rules/adblockfilterslite.txt
            rules/adblockdns.txt
            rules/adblockdnslite.txt
            rules/adblockdnsmasq.txt
            rules/adblockdnsmasqlite.txt
            rules/adblocksmartdns.conf
            rules/adblocksmartdnslite.conf
            rules/adblockshadowrocket.sgmodule
            rules/adblockshadowrocketlite.sgmodule
            rules/adblockqx.conf
            rules/adblockqxlite.conf
            rules/adblockclash.list
            rules/adblockclashlite.list
            rules/adblockmihomo.yaml
            rules/adblockmihomolite.yaml
            rules/adblockmihomo.mrs
            rules/adblockmihomolite.mrs
            rules/adblockhosts.txt
            rules/adblockhostslite.txt
            rules/adblocksingbox.json
            rules/adblocksingboxlite.json
            rules/adblocksingbox.srs
            rules/adblocksingboxlite.srs
            rules/adblockloon.list
            rules/adblockloonlite.list
            rules/adblocksurge.list
            rules/adblocksurgelite.list
            rules/adblockmosdns.txt
            rules/adblockmosdnslite.txt

      - name: 上传证明到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: ${{ steps.attest.outputs.bundle-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Refresh_CDN:
    needs: [ Update_Filters ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U tld IPy dnspython httpx loguru

      - name: Refsh CDN Cache
        run: |
          python refreshcdn.py

  Delete_Workflow_Runs:
    needs: [ Refresh_CDN, Release_Filters ]
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 5
